<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SyncAudio · 加入房间</title>
  <meta name="theme-color" content="#f5f7fb" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f6bff'/%3E%3Cg stroke='white' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 10v4M10 7v10M14 5v14M18 8v8'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
            <path d="M5 10v4M9 7v10M13 5v14M17 8v8" />
          </svg>
        </span>
        <div class="brand-text">
          <strong>SyncAudio</strong>
          <span>多设备同步音频</span>
        </div>
      </div>
      <span class="pill" id="status-pill" data-state="idle">
        <i></i><span id="status-text">未加入</span>
      </span>
    </header>

    <main class="stage">
      <section class="card auth-card" id="gate">
        <h1>加入房间</h1>
        <p class="sub">输入主机提供的房间密码，即可与本房间的设备同步播放。</p>

        <form class="form" id="join-form">
          <label class="field">
            <span>房间密码</span>
            <input
              id="room-password"
              type="password"
              inputmode="numeric"
              autocomplete="current-password"
              placeholder="请输入房间密码"
            />
          </label>
          <p class="error" id="error" hidden></p>
          <button class="btn primary" id="join-button" type="submit">加入房间</button>
        </form>

        <p class="hint" id="gate-hint">没有密码？请让主机查看启动日志里打印的房间密码。</p>
      </section>

      <section class="card room-card" id="room" hidden>
        <div class="room-head">
          <div>
            <h2>已加入房间</h2>
            <p class="sub" id="room-sub">正在接收主机的音频</p>
          </div>
          <button class="btn ghost" id="leave-button" type="button">离开</button>
        </div>

        <div class="metrics">
          <div class="metric">
            <span class="metric-label">时钟偏移</span>
            <span class="metric-value"><span id="offset-value">—</span><small>ms</small></span>
            <span class="metric-sub" id="offset-detail">等待校时</span>
          </div>
          <div class="metric">
            <span class="metric-label">手动延迟</span>
            <span class="metric-value"><span id="delay-value">0</span><small>ms</small></span>
            <span class="metric-sub">负值更早，正值更晚</span>
          </div>
        </div>

        <div class="slider-row">
          <span class="slider-bound">−200</span>
          <input
            id="manual-range"
            class="slider"
            type="range"
            min="-200"
            max="200"
            step="1"
            value="0"
            aria-label="手动延迟"
          />
          <span class="slider-bound">+200</span>
        </div>
      </section>
    </main>

    <footer class="foot">SyncAudio · 局域网多设备同步播放</footer>
  </div>

  <script type="module" src="/js/ui.js"></script>
</body>
</html>
